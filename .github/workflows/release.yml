name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install + build web
        run: |
          npm ci
          npm run build --workspace=flowbot-web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK + (optionally signed) release AAB
        working-directory: web/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          if [ -n "${{ secrets.AMKYAW_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.AMKYAW_KEYSTORE_BASE64 }}" | base64 -d > release.jks
            ./gradlew :app:bundleRelease :app:assembleRelease \
              -PAMKYAW_KEYSTORE_FILE="$(pwd)/release.jks" \
              -PAMKYAW_KEYSTORE_PASSWORD="${{ secrets.AMKYAW_KEYSTORE_PASSWORD }}" \
              -PAMKYAW_KEY_ALIAS="${{ secrets.AMKYAW_KEY_ALIAS }}" \
              -PAMKYAW_KEY_PASSWORD="${{ secrets.AMKYAW_KEY_PASSWORD }}" \
              --no-daemon --console=plain
          else
            echo "::warning::No signing secrets — building unsigned release AAB"
            ./gradlew :app:bundleRelease --no-daemon --console=plain
          fi
          rm -f release.jks

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp web/android/app/build/outputs/apk/debug/app-debug.apk dist/ 2>/dev/null || true
          cp web/android/app/build/outputs/apk/release/app-release.apk dist/ 2>/dev/null || true
          cp web/android/app/build/outputs/bundle/release/app-release.aab dist/ 2>/dev/null || true
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-debug.apk
            dist/app-release.apk
            dist/app-release.aab
          generate_release_notes: true
          fail_on_unmatched_files: false