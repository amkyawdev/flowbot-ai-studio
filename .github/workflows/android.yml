name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install + build web + sync Capacitor
        run: |
          npm ci
          npm run build --workspace=flowbot-web
          cd web && npx cap sync android --inline

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        working-directory: web/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Signed release APK + AAB. Runs when signing secrets are configured.
  release:
    runs-on: ubuntu-latest
    needs: apk
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env:
      KEYSTORE: ${{ secrets.AMKYAW_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.AMKYAW_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.AMKYAW_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.AMKYAW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install + build web + sync Capacitor
        run: |
          npm ci
          npm run build --workspace=flowbot-web
          cd web && npx cap sync android --inline

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build signed release APK + AAB
        working-directory: web/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            ./gradlew :app:bundleRelease :app:assembleRelease \
              -PAMKYAW_KEYSTORE_FILE="$(pwd)/release.jks" \
              -PAMKYAW_KEYSTORE_PASSWORD="$KS_PASS" \
              -PAMKYAW_KEY_ALIAS="$KS_ALIAS" \
              -PAMKYAW_KEY_PASSWORD="$KEY_PASS" \
              --no-daemon --console=plain
          else
            echo "::warning::Signing secrets not set — building unsigned release AAB only"
            ./gradlew :app:bundleRelease --no-daemon --console=plain
          fi

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: web/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload release APK (if signed)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: web/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn