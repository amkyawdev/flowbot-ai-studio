name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', 'migrations/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations (remote)
        working-directory: worker
        run: npx wrangler d1 migrations apply flowbot-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker secrets
        working-directory: worker
        if: ${{ secrets.CREDENTIAL_MASTER_KEY != '' }}
        run: |
          echo "${{ secrets.CREDENTIAL_MASTER_KEY }}" | npx wrangler secret put CREDENTIAL_MASTER_KEY
          echo "${{ secrets.AUTH_SESSION_SECRET }}" | npx wrangler secret put AUTH_SESSION_SECRET
          if [ -n "${{ secrets.ZILLIZ_ENDPOINT }}" ]; then echo "${{ secrets.ZILLIZ_ENDPOINT }}" | npx wrangler secret put ZILLIZ_ENDPOINT; fi
          if [ -n "${{ secrets.ZILLIZ_TOKEN }}" ]; then echo "${{ secrets.ZILLIZ_TOKEN }}" | npx wrangler secret put ZILLIZ_TOKEN; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}