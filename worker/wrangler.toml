name = "flowbot-ai-studio"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs
[observability]
enabled = true

# ---------------------------------------------------------------------------
# SCOPING note: this repo is deployed per-account with the resources below.
# Run `./scripts/provision-cloudflare.sh` (after `npx wrangler login`) to create
# D1 / KV / R2 / Queues, write real IDs into this file, apply migrations, and
# set the Worker secrets (CREDENTIAL_MASTER_KEY, AUTH_SESSION_SECRET,
# ZILLIZ_ENDPOINT, ZILLIZ_API_KEY). Zilliz config is kept as Worker SECRETS,
# so it is intentionally NOT declared in [vars] to avoid a vars/secret conflict.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Bindings. IDs are wired automatically when using `wrangler d1 create` /
# `wrangler kv namespace create` / `wrangler r2 bucket create`.
# Replace placeholders below with real IDs from your account.
# ---------------------------------------------------------------------------

# D1 SQLite database (relational app data)
[[d1_databases]]
binding = "DB"
database_name = "flowbot-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# KV (session cache, webhook routing)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_NAMESPACE_ID"

# R2 (file storage)
[[r2_buckets]]
binding = "R2"
bucket_name = "flowbot-files"

# Queue for background execution of long-running workflows
[[queues.producers]]
binding = "EXECUTION_QUEUE"
queue = "flowbot-executions"

[[queues.consumers]]
queue = "flowbot-executions"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "flowbot-executions-dlq"