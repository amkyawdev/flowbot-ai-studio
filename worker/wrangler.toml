name = "flowbot-ai-studio"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Hourly cleanup of public chat history older than 24 hours.
[triggers]
crons = ["17 * * * *"]

# Cloudflare Workers AI (server-side; no API key leaves the Worker).
[ai]
binding = "AI"

# Serve the built PWA from the same origin as the API (built by flowbot-web).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Production bindings (provisioned 2026-11-27 via Cloudflare Global API Key).
# Zilliz config (ZILLIZ_ENDPOINT, ZILLIZ_API_KEY) and vault/session secrets
# (CREDENTIAL_MASTER_KEY, AUTH_SESSION_SECRET) are set as Worker Secrets and
# deliberately NOT declared here to avoid vars/secret name conflicts.
# R2 is intentionally omitted: not enabled on this account (code 10042) and
# currently unused by the Worker. Enable R2 in the dashboard and add a bucket
# binding here when file storage is needed.
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "flowbot-db"
database_id = "4dd48ad3-215b-4feb-951d-dc53d046c7d9"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "422251cd4b4a48ce83c8d0b7e75ddaba"
preview_id = "422251cd4b4a48ce83c8d0b7e75ddaba"

# Background execution queue (producers)
[[queues.producers]]
binding = "EXECUTION_QUEUE"
queue = "flowbot-executions"

# Background execution queue (consumer)
[[queues.consumers]]
queue = "flowbot-executions"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "flowbot-executions-dlq"
